# Build the control-api image on GCP Cloud Build — never locally (keeps builds off the dev disk).
# Self-contained context (Dockerfile: COPY package.json + COPY . ., esbuild bundles src/server.ts).
# Output → Artifact Registry (us-west1); deploy with `gcloud run deploy control-api --image=...`.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--platform=linux/amd64', '-t', '${_IMAGE}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
images:
  - '${_IMAGE}'
options:
  machineType: 'E2_HIGHCPU_8'
timeout: 1800s
substitutions:
  _IMAGE: 'us-west1-docker.pkg.dev/project-bd87157a-f6fd-4d44-830/waddling/control-api:latest'
