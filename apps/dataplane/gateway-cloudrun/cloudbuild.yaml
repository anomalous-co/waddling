# Build the Cloud Run gateway image on GCP Cloud Build — never locally (local builds risk the
# dev disk). Cloud Build workers are native linux/amd64 (what Cloud Run needs). The committed
# birdshot/birdshot.duckdb_extension.gz rides along in the source upload and is COPYed by the
# Dockerfile; prebake-extensions.mjs caches httpfs/quack/ducklake/postgres/vss at build time.
# Output → Artifact Registry (us-west1). Roll to live QBs + repoint provisioner separately
# (see infra/gcp/deploy-prod.sh gateway(), or roll a single ws-<slug> for a targeted update).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--platform=linux/amd64', '-t', '${_IMAGE}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
images:
  - '${_IMAGE}'
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
timeout: 3600s
substitutions:
  _IMAGE: 'us-west1-docker.pkg.dev/project-bd87157a-f6fd-4d44-830/waddling/gateway:latest'
