# Assemble the runtime image on Cloud Build: prebuilt weights image (cached in AR) + TEI base.
# FAST — no HuggingFace download; it pulls the weights image + TEI base within GCP and copies the
# weight layer. Swap the TEI base by overriding _TEI_IMAGE (its tag is Cloud-Run-driver-sensitive:
# too new → CUDA_ERROR_UNSUPPORTED_PTX_VERSION at model load). Build the weights image first with
# cloudbuild.weights.yaml. Output → Artifact Registry (us-west1); deployed from AR by deploy.sh.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'WEIGHTS_IMAGE=${_WEIGHTS_IMAGE}'
      - '--build-arg'
      - 'TEI_IMAGE=${_TEI_IMAGE}'
      - '-t'
      - '${_IMAGE}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
images:
  - '${_IMAGE}'
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
timeout: 3600s
substitutions:
  _IMAGE: 'us-west1-docker.pkg.dev/project-bd87157a-f6fd-4d44-830/waddling/embeddings:latest'
  _WEIGHTS_IMAGE: 'us-west1-docker.pkg.dev/project-bd87157a-f6fd-4d44-830/waddling/embeddings-weights:qwen3-4b'
  # 89-1.8 = cc8.9/Ada build on CUDA 12.2.0 — matches Cloud Run's L4 driver (535.216.03 / CUDA
  # 12.2). TEI 1.9+ moved to CUDA 12.9 → CUDA_ERROR_UNSUPPORTED_PTX_VERSION at model load. Do NOT
  # bump past 1.8 until Google raises the managed L4 driver. (1.8 resolves to latest 1.8.x patch.)
  _TEI_IMAGE: 'ghcr.io/huggingface/text-embeddings-inference:89-1.8'
